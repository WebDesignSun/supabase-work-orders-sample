# AI code review on every pull request, against the rules in CLAUDE.md.
# Claude posts its findings as PR comments; any finding of severity "high"
# fails this job, so the PR cannot be accepted until it is fixed.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`,
# runs on the team's Claude subscription, no separate API billing).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. CLAUDE.md in the repository root is binding:
            read it first, then read the diff (`gh pr diff`) and every file it touches.

            Check the change against each CLAUDE.md rule, and for correctness,
            security and tests. Assign each finding one severity:
            - high: a defect, a security or tenant-isolation hole (RLS gap, missing
              policy without a "deny" comment, bare auth.uid(), security definer
              outside `private`, service role without justification, internal
              details in a response), an edited migration that is already on main,
              new behaviour without a test, or a broken CLAUDE.md rule.
            - medium: a likely bug or a maintainability problem that should be
              fixed in this PR (e.g. README counts or versions out of date).
            - low: style or a suggestion.
            Report only real problems in the changed code; no praise, no nitpicks
            about formatting (deno fmt checks that).

            Post each finding as an inline comment on the line, starting with
            `[high]`, `[medium]` or `[low]`. Then post one PR comment with
            `gh pr comment` that lists all findings by severity, or says that
            there are none. Return the same findings as structured output.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["high","medium","low"]},"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"rule":{"type":"string"}},"required":["severity","file","title"]}}},"required":["findings"]}'

      # Quality gate: open "high" findings block acceptance.
      - name: Fail on high findings
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::The review returned no structured result."
            exit 1
          fi
          {
            echo "## Claude review"
            echo "$RESULT" | jq -r '.findings | if length == 0 then "No findings." else
              (["| Severity | File | Finding |", "| --- | --- | --- |"]
               + map("| \(.severity) | `\(.file)\(if .line then ":\(.line)" else "" end)` | \(.title | gsub("\\|"; "\\|")) |"))
              | join("\n") end'
          } >> "$GITHUB_STEP_SUMMARY"
          high=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "high")] | length')
          if [ "$high" -gt 0 ]; then
            echo "::error::$high high-severity finding(s). Fix them before the PR is accepted."
            exit 1
          fi
